name: CI

on:
  push:
    branches: [ main, "feat/**" ]
  pull_request:
    branches: [ main ]

jobs:
  portable-sockets:
    name: Sockets (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -p test_sockets.py -v
      - run: python -m unittest discover -s tests -p test_immutable.py -v
      - run: python tests/demo_terminal.py advisory
      - run: python tests/demo_terminal.py block
      - run: hold-up --list-feeds

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry project
        run: |
          python -m pip install poetry==2.2.1
          poetry install --no-interaction
          poetry check --lock --strict

      - name: Run unit test suite
        run: |
          poetry run python -m unittest discover -s tests -p "test_*.py" -v
          poetry run hold-up --list-feeds

  lint-and-validate:
    name: Lint & Schema Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry project
        run: |
          python -m pip install poetry==2.2.1
          poetry install --no-interaction
          poetry check --lock --strict
          poetry build
          poetry run ruff check src scripts tests
          poetry run ruff format --check src scripts tests

      - name: Validate JSON syntax
        run: |
          poetry run python -c "import json; from pathlib import Path; [json.loads(p.read_text()) for p in Path('.').rglob('*.json') if not {'.git', '.venv', 'dist'}.intersection(p.parts)]"

      - name: Verify isolated wheel installation
        run: |
          python -m venv "$RUNNER_TEMP/hold-up-wheel"
          "$RUNNER_TEMP/hold-up-wheel/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/hold-up-wheel/bin/python" -c 'from importlib.resources import files; import json; assert json.loads(files("holdup").joinpath("data/status_feeds.json").read_text())["feeds"]'
          "$RUNNER_TEMP/hold-up-wheel/bin/hold-up" --list-feeds
          "$RUNNER_TEMP/hold-up-wheel/bin/hold-up-evaluate" --help

      - name: Verify Python syntax
        run: |
          poetry run python -m compileall -q src scripts tests

      - name: Test hook CLI flags
        run: |
          poetry run python scripts/provider_status.py --list-feeds
          poetry run hold-up --list-feeds
          poetry run python -m unittest discover -s tests -p 'test_contracts.py' -v
